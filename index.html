<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Curling Stopwatch Duo</title>

    <link rel="icon" type="image/x-icon" href="favicon.ico">
    
    <style>
        :root {
            --bg-color: #ffffff;
            --panel-bg: #f5f5f7;
            --accent-blue: #2c6edd; /* Синий цвет для керлинга */
            --accent-red: #d32f2f;  /* Красный цвет для керлинга */
            --text-main: #000000;
            --text-dim: #666666;
            --border-color: #e0e0e0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        header {
            text-align: center;
            padding: 15px 10px;
            border-bottom: 1px solid var(--border-color);
            z-index: 10;
            position: relative;
        }

        h1 {
            font-size: clamp(1rem, 4vw, 1.5rem);
            letter-spacing: 1px;
            font-weight: 600;
        }

        /* ГЛАВНЫЙ КОНТЕЙНЕР */
        .dual-container {
            display: flex;
            width: 100%;
            height: calc(100% - 65px);
            gap: 10px;
            padding: 10px;
        }

        @media (max-width: 600px) {
            .dual-container {
                flex-direction: column;
            }
        }

        .stopwatch-panel {
            flex: 1;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            min-height: 0;
        }

        .panel-label {
            position: absolute;
            top: 10px;
            left: 15px;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.8rem;
            color: var(--text-dim);
        }
        .label-out { color: var(--accent-blue); }
        .label-in { color: var(--accent-red); }

        .time-display {
            font-size: clamp(2.5rem, 20vw, 5rem);
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            margin-bottom: 10px;
            line-height: 1;
        }

        .lap-info {
            font-size: 0.9rem;
            color: var(--text-dim);
            margin-bottom: 20px;
            text-align: center;
            min-height: 1.2em;
        }
        .lap-info.active { color: #ff8f00; }

        .controls {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            touch-action: manipulation;
            user-select: none;
        }
        button:active { transform: scale(0.95); }

        .btn-start-stop { background: #e0e0e0; color: #000; }
        .btn-start-stop.running { 
            background: var(--accent-blue); 
            color: white; 
        }
        .btn-lap { background: rgba(0,0,0,0.05); color: #333; border: 1px solid #ccc; }
        .btn-reset { background: transparent; color: #999; border: 1px dashed #999; }
        
        /* Кнопки сохранения и очистки */
        .global-controls {
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-color);
            width: 100%;
        }
        .save-btn {
            background: white;
            border: 2px solid var(--accent-blue);
            color: var(--accent-blue);
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
        }
        .clear-btn {
            background: white;
            border: 2px solid var(--accent-red);
            color: var(--accent-red);
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
        }

        .saved-list {
            width: 100%;
            max-height: 200px;
            overflow-y: auto;
            margin-top: 20px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
        }
        .saved-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            margin-bottom: 6px;
            background: white;
            border-radius: 6px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .saved-time { font-size: 1.1rem; font-weight: bold; }
        .saved-side { font-size: 0.85rem; color: var(--text-dim); }

        .laps-list {
            width: 100%;
            max-height: 140px;
            overflow-y: auto;
            margin-top: 10px;
            flex-shrink: 0;
        }
        
        .lap-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 10px;
            margin-bottom: 4px;
            background: rgba(255,255,255,0.6);
            border-radius: 6px;
            font-size: 0.85rem;
        }
        .lap-num { color: var(--text-dim); }
        .lap-diff { color: var(--accent-blue); font-weight: bold; }
        .lap-total { color: #666; font-size: 0.75rem; }

        .share-app-btn {
            margin-top: 15px;
            padding: 12px 30px;
            background: #333;
            color: white;
            border-radius: 8px;
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>Curling Stopwatch</h1>
    </header>
    

    <div class="dual-container">
        <!-- ЛЕВЫЙ СЕКУНДОМЕР (OUT) -->
        <div class="stopwatch-panel">
            <div class="panel-label label-out">OUT</div>
            <div class="time-display" id="time1">00:00.00</div>
            <div class="lap-info" id="lapInfo1">Старт для отсчёта</div>
            
            <div class="controls">
                <button class="btn-start-stop" id="btnStart1" onclick="toggleTimer(1)">СТАРТ</button>
                <button class="btn-lap" id="btnLap1" onclick="recordLap(1)" disabled>КРУГ</button>
                <button class="btn-reset" onclick="resetTimer(1)">СБРОС</button>
            </div>
            <div class="laps-list" id="laps1"></div>
        </div>

        <!-- ПРАВЫЙ СЕКУНДОМЕР (IN) -->
        <div class="stopwatch-panel">
            <div class="panel-label label-in">IN</div>
            <div class="time-display" id="time2">00:00.00</div>
            <div class="lap-info" id="lapInfo2">Старт для отсчёта</div>

            <div class="controls">
                <button class="btn-start-stop" id="btnStart2" onclick="toggleTimer(2)">СТАРТ</button>
                <button class="btn-lap" id="btnLap2" onclick="recordLap(2)" disabled>КРУГ</button>
                <button class="btn-reset" onclick="resetTimer(2)">СБРОС</button>
            </div>

            <div class="laps-list" id="laps2"></div>
        </div>
    </div>

    <!-- ГЛОБАЛЬНЫЕ КОНТРОЛЫ: СОХРАНЕНИЕ И ОЧИСТКА -->
    <div class="global-controls">
        <button class="save-btn" onclick="saveCurrentTimes()">Сохранить время</button>
        <button class="clear-btn" onclick="clearSavedTimes()">Очистить сохранённые</button>
    </div>

    <!-- СПИСОК СОХРАНЁННЫХ ВРЕМЕН -->
    <div style="padding: 20px;">
        <h3>Сохранённые результаты</h3>
        <div class="saved-list" id="savedList">
            <p style="color: #999; text-align: center;">Здесь появятся сохранённые времена</p>
        </div>
    </div>

    <!-- КНОПКА ПОДЕЛИТЬСЯ ПРИЛОЖЕНИЕМ -->
    <div style="text-align: center; padding: 15px;">
        <a href="#" class="share-app-btn" onclick="shareApp()">Поделиться приложением</a>
    </div>

<script>
    // Хранилище данных для двух таймеров
    const timers = {
        1: { running: false, elapsed: 0, startTime: 0, laps: [], lastLapTime: 0 },
        2: { running: false, elapsed: 0, startTime: 0, laps: [], lastLapTime: 0 }
    };

    // Хранилище сохранённых времен
    let savedTimes = [];

    function formatTime(ms) {
        const totalSeconds = Math.floor(ms / 1000);
        const minutes = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
        const seconds = String(totalSeconds % 60).padStart(2, '0');
        const centis = String(Math.floor((ms % 1000) / 10)).padStart(2, '0');
        return `${minutes}:${seconds}.${centis}`;
    }

    function updateTimer(id) {
        const t = timers[id];
        const displayEl = document.getElementById(`time${id}`);
        const infoEl = document.getElementById(`lapInfo${id}`);

        let currentMs = t.elapsed;
        if (t.running) {
            currentMs += performance.now() - t.startTime;
        }

        displayEl.textContent = formatTime(currentMs);

        if (t.laps.length > 0) {
            const lastLapTotal = t.laps[t.laps.length - 1].totalAtPress;
            const currentLapDiff = currentMs - lastLapTotal;
            infoEl.textContent = `Круг: ${formatTime(currentLapDiff)}`;
            infoEl.classList.add('active');
        } else if (t.running || t.elapsed > 0) {
            infoEl.textContent = `Общее: ${formatTime(currentMs)}`;
            infoEl.classList.remove('active');
        } else {
            infoEl.textContent = 'Старт для отсчёта';
            infoEl.classList.remove('active');
        }

        if (t.running) {
            requestAnimationFrame(() => updateTimer(id));
        }
    }

    function toggleTimer(id) {
        const t = timers[id];
        const btn = document.getElementById(`btnStart${id}`);
        const lapBtn = document.getElementById(`btnLap${id}`);

        if (!t.running) {
            t.running = true;
            t.startTime = performance.now();
            btn.textContent = "СТОП";
            btn.classList.add('running');
            lapBtn.disabled = false;
            updateTimer(id);
        } else {
            t.running = false;
            t.elapsed += performance.now() - t.startTime;
            btn.textContent = "СТАРТ";
            btn.classList.remove('running');
            lapBtn.disabled = true;
            updateTimer(id); 
        }
    }

    function recordLap(id) {
        const t = timers[id];
        if (!t.running && t.elapsed === 0) return;

        const now = t.running ? t.elapsed + (performance.now() - t.startTime) : t.elapsed;
        const diff = now - t.lastLapTime;

        t.laps.push({
            num: t.laps.length + 1,
            diff: diff,
            totalAtPress: now
        });
        t.lastLapTime = now;

        renderLaps(id);
    }

    function renderLaps(id) {
        const listEl = document.getElementById(`laps${id}`);
        listEl.innerHTML = '';
        const recent = timers[id].laps.slice(-5).reverse();
        recent.forEach(lap => {
            const div = document.createElement('div');
            div.className = 'lap-item';
            div.innerHTML = `
                <span class="lap-num">#${lap.num}</span>
                <span class="lap-diff">${formatTime(lap.diff)}</span>
                <span class="lap-total">${formatTime(lap.totalAtPress)}</span>
            `;
            listEl.appendChild(div);
        });
    }

    function resetTimer(id) {
        const t = timers[id];
        t.running = false;
        t.elapsed = 0;
        t.laps = [];
        t.lastLapTime = 0;

        document.getElementById(`time${id}`).textContent = '00:00.00';
        document.getElementById(`lapInfo${id}`).textContent = 'Старт для отсчёта';
        document.getElementById(`laps${id}`).innerHTML = '';

        const btn = document.getElementById(`btnStart${id}`);
        btn.textContent = 'СТАРТ';
        btn.classList.remove('running');
        document.getElementById(`btnLap${id}`).disabled = true;
    }

    // --- НОВЫЕ ФУНКЦИИ ---

    function saveCurrentTimes() {
        const time1 = timers[1].elapsed;
        const time2 = timers[2].elapsed;

        // Сохраняем только если есть что сохранять (хотя бы один таймер работал)
        if (time1 === 0 && time2 === 0) {
            alert("Сначала засеките время!");
            return;
        }

        savedTimes.push({
            time1: time1,
            time2: time2,
            timestamp: new Date().toLocaleTimeString()
        });
                renderSavedTimes();
    }

    function renderSavedTimes() {
        const listEl = document.getElementById('savedList');
        if (savedTimes.length === 0) {
            listEl.innerHTML = '<p style="color: #999; text-align: center;">Здесь появятся сохранённые времена</p>';
            return;
        }

        listEl.innerHTML = '';
        // Показываем в обратном порядке — последние сверху
        savedTimes.slice().reverse().forEach((saved, idx) => {
            const realIdx = savedTimes.length - 1 - idx;
            const div = document.createElement('div');
            div.className = 'saved-item';
            div.innerHTML = `
                <div>
                    <span class="saved-time" style="color: var(--accent-blue);">OUT ${formatTime(saved.time1)}</span>
                    <span style="margin: 0 8px; color: #ccc;">|</span>
                    <span class="saved-time" style="color: var(--accent-red);">IN ${formatTime(saved.time2)}</span>
                </div>
                <span class="saved-side">${saved.timestamp}</span>
                <button onclick="deleteSavedTime(${realIdx})" style="background:transparent;border:none;color:#999;cursor:pointer;font-size:1.2rem;padding:4px 8px;">×</button>
            `;
            listEl.appendChild(div);
        });
    }

    function deleteSavedTime(index) {
        savedTimes.splice(index, 1);
        renderSavedTimes();
    }

    function clearSavedTimes() {
        if (savedTimes.length === 0) {
            alert("Нет сохранённых времён для очистки.");
            return;
        }
        if (confirm("Удалить все сохранённые результаты?")) {
            savedTimes = [];
            renderSavedTimes();
        }
    }

    function shareApp() {
        const shareData = {
            title: 'Curling Stopwatch Duo',
            text: 'Двойной секундомер для кёрлинга — замеряй время OUT и IN одновременно!',
            url: window.location.href
        };

        if (navigator.share) {
            navigator.share(shareData).catch(err => console.log('Share cancelled:', err));
        } else {
            // Fallback: копируем ссылку в буфер обмена
            navigator.clipboard.writeText(window.location.href).then(() => {
                alert("Ссылка на приложение скопирована в буфер обмена!");
            }).catch(() => {
                // Если буфер обмена недоступен — показываем ссылку
                prompt("Скопируйте ссылку и поделитесь:", window.location.href);
            });
        }
    }

    // Инициализация при загрузке
    renderSavedTimes();
</script>
</body>
</html>
